<!doctype html>
<!--
  NGD preset shell. Copy to design/presets/round-<n>.html and fill in:
    1. <title> and the .brand-name text in the toolbar
    2. <style id="tokens">  → paste the output of: node scripts/palette.mjs --brand "#hex"
    3. <link> tags for the preset fonts (only the families/weights you use)
    4. <style id="preset-styles"> → one nested block per preset, scoped by its id (#p1 { ... })
    5. five <section class="preset"> blocks (and their <template class="notes">)
  Everything else (switcher, viewport toggle, theme toggle, notes drawer, overview, keyboard
  shortcuts, placeholders, icon sprite) is ready to use. Keep the file self-contained.
  Presets respond to the frame width with container queries: @container page (width >= 900px) { ... }
  Icon paths adapted from Feather Icons (MIT).
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Project name: design presets, round 1</title>
<!-- Fonts for the presets, e.g.:
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;600&display=swap" rel="stylesheet"> -->
<style id="tokens">
/* Paste palette.mjs output here. These fallbacks only exist so the empty shell renders. */
:root { color-scheme: light; --color-bg: #fdfdfd; --color-bg-subtle: #f6f6f5; --color-surface: #fdfdfd; --color-surface-raised: #fff;
  --color-text: #161616; --color-text-muted: #5f5f5f; --color-text-subtle: #7b7b7b; --color-border: #e5e5e3; --color-border-strong: #d2d2cf;
  --color-accent: #4f46e5; --color-accent-hover: #4338ca; --color-on-accent: #fff; --color-accent-subtle: #f1f0ff; --color-accent-text: #4338ca; --color-focus: #4338ca; }
[data-theme="dark"] { color-scheme: dark; --color-bg: #0b0b0c; --color-bg-subtle: #121214; --color-surface: #121214; --color-surface-raised: #1b1b1e;
  --color-text: #f4f4f5; --color-text-muted: #a3a3aa; --color-text-subtle: #7b7b82; --color-border: #2a2a2e; --color-border-strong: #45454a;
  --color-accent: #818cf8; --color-accent-hover: #a5b4fc; --color-on-accent: #0b0b0c; --color-accent-subtle: #1e1b4b; --color-accent-text: #a5b4fc; --color-focus: #a5b4fc; }
</style>
<style id="shell">
  /* ---------- shell chrome (neutral on purpose: it must not compete with the presets) ---------- */
  *, *::before, *::after { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body { margin: 0; background: #e9e9e7; color: #161616; font: 14px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  body[data-chrome="dark"] { background: #1a1a1a; }
  .bar { position: sticky; top: 0; z-index: 100; display: flex; align-items: center; gap: 12px; flex-wrap: wrap; padding: 8px 12px;
    background: rgb(17 17 17 / 0.94); color: #f2f2f2; backdrop-filter: blur(12px); font-size: 13px; }
  .bar .brand-name { font-weight: 600; white-space: nowrap; }
  .bar .round { color: #9a9a9a; white-space: nowrap; }
  .bar .group { display: flex; gap: 2px; padding: 2px; border-radius: 10px; background: rgb(255 255 255 / 0.08); }
  .bar .spacer { flex: 1; }
  .bar button { appearance: none; border: 0; border-radius: 8px; padding: 6px 10px; background: transparent; color: inherit; font: inherit; cursor: pointer; white-space: nowrap; }
  .bar button:hover { background: rgb(255 255 255 / 0.1); }
  .bar button[aria-pressed="true"], .bar button[aria-selected="true"] { background: #f2f2f2; color: #111; }
  .bar button:focus-visible { outline: 2px solid #8ab4ff; outline-offset: 1px; }
  .bar kbd { font: 11px ui-monospace, monospace; opacity: 0.55; margin-left: 4px; }
  .tabs button .num { font-weight: 700; margin-right: 4px; }
  .hint { padding: 10px 16px; text-align: center; color: #666; font-size: 12.5px; }
  body[data-chrome="dark"] .hint { color: #999; }

  .stage { padding: 20px 16px 48px; }
  .preset { display: none; }
  .preset.is-active { display: block; }
  .frame { container: page / inline-size; width: 100%; margin: 0 auto; background: var(--color-bg); color: var(--color-text);
    box-shadow: 0 1px 2px rgb(0 0 0 / 0.08), 0 12px 40px -12px rgb(0 0 0 / 0.25); overflow: clip; transition: width 0.25s ease; }
  body[data-view="tablet"] .frame { width: 820px; border-radius: 18px; }
  body[data-view="mobile"] .frame { width: 390px; border-radius: 28px; }

  /* overview: all presets as scaled first-viewport cards */
  body[data-view="overview"] .stage { display: grid; grid-template-columns: repeat(auto-fill, minmax(432px, 1fr)); gap: 20px; }
  body[data-view="overview"] .preset { display: block; cursor: pointer; }
  body[data-view="overview"] .preset .frame { width: 1440px; height: 900px; zoom: 0.3; pointer-events: none; border-radius: 30px; }
  body[data-view="overview"] .preset::after { content: attr(data-index) "  " attr(data-name); display: block; margin-top: 8px; font-weight: 600; }
  body[data-view="overview"] .preset:hover .frame { outline: 6px solid #8ab4ff; }

  .notes-panel { position: fixed; z-index: 120; top: 56px; right: 12px; width: min(380px, calc(100vw - 24px)); max-height: calc(100vh - 72px); overflow: auto;
    padding: 18px 20px; border-radius: 14px; background: #fff; color: #161616; box-shadow: 0 20px 60px -10px rgb(0 0 0 / 0.35); font-size: 13.5px; }
  .notes-panel[hidden] { display: none; }
  .notes-panel h2 { margin: 0 0 4px; font-size: 17px; }
  .notes-panel p, .notes-panel li { color: #3f3f3f; }
  .notes-panel dt { margin-top: 10px; font-weight: 600; font-size: 12px; text-transform: uppercase; letter-spacing: 0.04em; color: #777; }
  .notes-panel dd { margin: 2px 0 0; }

  @media (max-width: 860px) {
    body[data-view="tablet"] .frame { width: 100%; }
    .bar kbd { display: none; }
  }

  /* ---------- helpers presets may use (inside .frame) ---------- */
  .frame img, .frame svg, .frame video { display: block; max-width: 100%; }
  .frame button, .frame input, .frame select, .frame textarea { font: inherit; color: inherit; }
  .frame :focus-visible { outline: 2px solid var(--color-focus); outline-offset: 2px; }
  .frame [data-theme] { background: var(--color-bg); color: var(--color-text); }
  .i { width: 1.25em; height: 1.25em; flex: none; fill: none; stroke: currentColor; stroke-width: 1.75; stroke-linecap: round; stroke-linejoin: round; }

  /* Image placeholder: say what the real image will show. <div class="ph" style="aspect-ratio: 4/3"><span>Photo: …</span></div> */
  .ph { position: relative; display: grid; place-items: center; min-height: 64px; padding: 12px; overflow: hidden; text-align: center;
    background: color-mix(in oklab, var(--color-accent) 12%, var(--color-bg-subtle)); color: var(--color-text-muted);
    font: 500 11.5px/1.35 ui-monospace, SFMono-Regular, Menlo, monospace; border-radius: inherit; }
  .ph::before { content: ""; position: absolute; inset: 0;
    background: repeating-linear-gradient(135deg, transparent 0 13px, color-mix(in oklab, currentColor 9%, transparent) 13px 14px); }
  .ph > span { position: relative; max-width: 30ch; padding: 4px 8px; border-radius: 6px; background: color-mix(in oklab, var(--color-bg) 82%, transparent); }
  .ph--dark { background: color-mix(in oklab, var(--color-accent) 18%, #141414); color: #cfcfcf; }
  .ph--dark > span { background: rgb(0 0 0 / 0.45); }
  .ph--round { border-radius: 999px; aspect-ratio: 1; min-height: 0; padding: 0; }
  .ph--round > span { display: none; }
  .ph-logo { display: inline-grid; place-items: center; height: 28px; padding: 0 14px; border-radius: 6px; font: 700 12px/1 system-ui, sans-serif;
    letter-spacing: 0.06em; text-transform: uppercase; color: var(--color-text-subtle); background: color-mix(in oklab, var(--color-text) 6%, transparent); }
  .skel { display: block; height: 0.8em; border-radius: 6px; background: color-mix(in oklab, var(--color-text) 9%, transparent); }

  @media (prefers-reduced-motion: reduce) {
    .frame *, .frame *::before, .frame *::after { animation-duration: 0.01ms !important; animation-iteration-count: 1 !important; transition-duration: 0.01ms !important; }
  }
</style>
<style id="preset-styles">
/* One nested block per preset. Respond to the frame, not the window:
#p1 {
  font-family: "Inter Tight", system-ui, sans-serif;
  .hero { display: grid; gap: 32px; padding: 72px 20px; }
  @container page (width >= 900px) { .hero { grid-template-columns: 5fr 7fr; padding: 120px 64px; } }
}
*/
</style>

<script>
(() => {
  const presets = [...document.querySelectorAll('.preset')];
  const tabs = document.querySelector('.tabs');
  const notesPanel = document.querySelector('.notes-panel');
  const notesToggle = document.querySelector('.notes-toggle');
  const themeGroup = document.querySelector('[data-theme-group]');
  const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
  const state = { index: 0, view: 'desktop', theme: prefersDark ? 'dark' : 'light' };

  presets.forEach((p, i) => {
    p.dataset.index ||= String(i + 1);
    const b = document.createElement('button');
    b.type = 'button';
    b.setAttribute('role', 'tab');
    b.innerHTML = `<span class="num">${p.dataset.index}</span>${p.dataset.name || ''}`;
    b.addEventListener('click', () => select(i));
    tabs.append(b);
    p.addEventListener('click', () => { if (state.view === 'overview') { setView('desktop'); select(i); } });
  });

  function themesOf(p) { return (p.dataset.themes || 'light dark').split(/\s+/); }

  function applyTheme() {
    presets.forEach((p) => {
      const allowed = themesOf(p);
      const t = allowed.includes(state.theme) ? state.theme : allowed[0];
      p.querySelector('.frame')?.setAttribute('data-theme', t);
    });
    const active = presets[state.index];
    const allowed = active ? themesOf(active) : ['light', 'dark'];
    themeGroup.hidden = allowed.length < 2;
    themeGroup.querySelectorAll('button').forEach((b) => b.setAttribute('aria-pressed', String(b.dataset.setTheme === state.theme)));
    document.body.dataset.chrome = state.theme;
  }

  function renderNotes() {
    const tpl = presets[state.index]?.querySelector('template.notes');
    notesPanel.replaceChildren(tpl ? tpl.content.cloneNode(true) : document.createTextNode('No notes for this preset.'));
  }

  function select(i) {
    if (!presets.length) return;
    state.index = (i + presets.length) % presets.length;
    presets.forEach((p, j) => p.classList.toggle('is-active', j === state.index));
    tabs.querySelectorAll('button').forEach((b, j) => b.setAttribute('aria-selected', String(j === state.index)));
    // Hash never equals an element id, so reloading does not jump the page: #preset=3&view=mobile
    history.replaceState(null, '', `#preset=${presets[state.index].dataset.index}${state.view === 'desktop' ? '' : '&view=' + state.view}`);
    applyTheme();
    renderNotes();
    if (state.view !== 'overview') window.scrollTo({ top: 0 });
  }

  function setView(v) {
    state.view = v;
    document.body.dataset.view = v;
    document.querySelectorAll('[data-view]').forEach((b) => b.matches('button') && b.setAttribute('aria-pressed', String(b.dataset.view === v)));
    select(state.index);
  }

  document.querySelectorAll('button[data-view]').forEach((b) => b.addEventListener('click', () => setView(b.dataset.view)));
  themeGroup.querySelectorAll('button').forEach((b) => b.addEventListener('click', () => { state.theme = b.dataset.setTheme; applyTheme(); }));
  notesToggle.addEventListener('click', () => {
    notesPanel.hidden = !notesPanel.hidden;
    notesToggle.setAttribute('aria-expanded', String(!notesPanel.hidden));
  });

  document.addEventListener('keydown', (e) => {
    if (e.metaKey || e.ctrlKey || e.altKey || /input|textarea|select/i.test(e.target.tagName)) return;
    const k = e.key.toLowerCase();
    if (/^[1-9]$/.test(k) && presets[Number(k) - 1]) select(Number(k) - 1);
    else if (k === 'arrowright') select(state.index + 1);
    else if (k === 'arrowleft') select(state.index - 1);
    else if (k === 'd') setView('desktop');
    else if (k === 't') setView('tablet');
    else if (k === 'm') setView('mobile');
    else if (k === 'o') setView(state.view === 'overview' ? 'desktop' : 'overview');
    else if (k === 'l') { state.theme = state.theme === 'dark' ? 'light' : 'dark'; applyTheme(); }
    else if (k === 'n') notesToggle.click();
  });

  // Restore from the hash: #preset=3&view=mobile
  const params = new URLSearchParams(location.hash.slice(1));
  const wanted = presets.findIndex((p) => p.dataset.index === params.get('preset'));
  state.index = Math.max(0, wanted);
  setView(['tablet', 'mobile', 'overview'].includes(params.get('view')) ? params.get('view') : 'desktop');
})();
</script>
</body>
</html>
